<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}跨境ERP系统{% endblock %}</title>
<link href="https://cdn.staticfile.org/twitter-bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/style.css" rel="stylesheet">
</head>
<body>
{% if user %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/orders">跨境ERP系统</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/orders">订单列表</a></li>
        <li class="nav-item"><a class="nav-link" href="/orders/new">新建发货订单</a></li>
        {% if user.is_admin %}
        <li class="nav-item"><a class="nav-link" href="/admin/users">用户审核</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/shops">店铺管理</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/logistics">物流商配置</a></li>
        {% endif %}
      </ul>
      <span class="navbar-text text-light me-3">{{ user.real_name or user.username }}（{{ '管理员' if user.is_admin else '普通用户' }}）</span>
      <a href="/logout" class="btn btn-outline-light btn-sm">退出登录</a>
    </div>
  </div>
</nav>
{% endif %}
<div class="container mb-5">
{% block content %}{% endblock %}
</div>
<script src="https://cdn.staticfile.org/twitter-bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
