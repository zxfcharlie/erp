{% extends "base.html" %}
{% block title %}注册 - 跨境ERP系统{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="mb-3 text-center">注册账号</h4>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        {% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}
        <form method="post" action="/register">
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input class="form-control" name="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label">姓名（可选）</label>
            <input class="form-control" name="real_name">
          </div>
          <div class="mb-3">
            <label class="form-label">密码</label>
            <input class="form-control" type="password" name="password" required minlength="6">
          </div>
          <div class="mb-3">
            <label class="form-label">确认密码</label>
            <input class="form-control" type="password" name="password2" required minlength="6">
          </div>
          <button class="btn btn-primary w-100" type="submit">注册</button>
        </form>
        <div class="text-center mt-3">
          <a href="/login">已有账号？去登录</a>
        </div>
        <p class="text-muted small mt-3">注册后需等待管理员审核通过方可登录使用（系统第一个注册用户将自动成为管理员）。</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
