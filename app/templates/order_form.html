{% extends "base.html" %}
{% block title %}新建发货订单{% endblock %}
{% block content %}
<h4 class="mb-3">新建发货订单（推送云途物流下单信息）</h4>
<form method="post" action="/orders/new">

  <div class="form-section-title">业务金额信息（新增）</div>
  <div class="row g-2">
    <div class="col-md-3">
      <label class="form-label">所属店铺 *</label>
      <select class="form-select" name="shop_id" required>
        <option value="">请选择店铺</option>
        {% for s in shops %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">订单金额</label>
      <input class="form-control" type="number" step="0.01" name="order_amount" value="0">
    </div>
    <div class="col-md-3">
      <label class="form-label">实收金额</label>
      <input class="form-control" type="number" step="0.01" name="actual_received_amount" value="0">
    </div>
    <div class="col-md-3">
      <label class="form-label">采购成本（人民币）</label>
      <input class="form-control" type="number" step="0.01" name="purchase_cost_rmb" value="0">
    </div>
  </div>
  <p class="text-muted small">创建时间与创建人将在提交后由系统自动记录（当前登录用户 / 当前时间）。</p>

  <div class="form-section-title">基础信息</div>
  <div class="row g-2">
    <div class="col-md-3">
      <label class="form-label">客户订单号</label>
      <input class="form-control" name="customer_order_number">
    </div>
    <div class="col-md-3">
      <label class="form-label">产品代码(云途产品编码) *</label>
      <input class="form-control" name="product_code" placeholder="不带电产品编码" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">货物类型</label>
      <input class="form-control" name="cargo_type" placeholder="如：不带电">
    </div>
    <div class="col-md-3">
      <label class="form-label">申报币种 *</label>
      <select class="form-select" name="declare_currency" required>
        <option value="USD" selected>USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
        <option value="CNY">CNY</option>
      </select>
    </div>
  </div>


  <div class="form-section-title">增值服务 / 税号信息</div>
  <div class="row g-2">
    <div class="col-md-2"><label class="form-label">附加服务</label><input class="form-control" name="additional_service" placeholder="如 20/A0/G0/V1/10/V4"></div>
    <div class="col-md-2 form-check mt-4"><input class="form-check-input" type="checkbox" name="insurance_service"><label class="form-check-label">保价服务</label></div>
    <div class="col-md-2"><label class="form-label">自定义保价保额</label><input class="form-control" type="number" step="0.01" name="insurance_amount" value="0"></div>
    <div class="col-md-2 form-check mt-4"><input class="form-check-input" type="checkbox" name="signature_service"><label class="form-check-label">签名服务</label></div>
    <div class="col-md-2"><label class="form-label">代收代付</label><input class="form-control" name="cod_flag"></div>
  </div>
  <div class="row g-2 mt-1">
    <div class="col-md-3"><label class="form-label">增值税号(VAT)</label><input class="form-control" name="vat_number"></div>
    <div class="col-md-3"><label class="form-label">欧盟税号</label><input class="form-control" name="eu_tax_number"></div>
    <div class="col-md-3"><label class="form-label">IOSS识别码</label><input class="form-control" name="ioss_number"></div>
    <div class="col-md-3"><label class="form-label">统一社会信用代码</label><input class="form-control" name="uscc"></div>
  </div>
  <div class="row g-2 mt-1">
    <div class="col-md-4"><label class="form-label">生产销售单位</label><input class="form-control" name="production_sales_unit"></div>
  </div>

  <div class="form-section-title">收件人信息</div>
  <div class="row g-2">
    <div class="col-md-2"><label class="form-label">国家 *</label><input class="form-control" name="receiver_country" required placeholder="如 US"></div>
    <div class="col-md-3"><label class="form-label">姓名 *</label><input class="form-control" name="receiver_name" required></div>
    <div class="col-md-3"><label class="form-label">公司</label><input class="form-control" name="receiver_company"></div>
    <div class="col-md-2"><label class="form-label">ID</label><input class="form-control" name="receiver_id_number"></div>
    <div class="col-md-2"><label class="form-label">门牌号 *</label><input class="form-control" name="receiver_house_number" required></div>
  </div>
  <div class="row g-2 mt-1">
    <div class="col-md-4"><label class="form-label">详细地址 *</label><input class="form-control" name="receiver_address" required></div>
    <div class="col-md-2"><label class="form-label">城市 *</label><input class="form-control" name="receiver_city" required></div>
    <div class="col-md-2"><label class="form-label">省/州 *</label><input class="form-control" name="receiver_state" required></div>
    <div class="col-md-2"><label class="form-label">邮编 *</label><input class="form-control" name="receiver_zip" required></div>
    <div class="col-md-2"><label class="form-label">电话 *</label><input class="form-control" name="receiver_phone" required></div>
  </div>
  <div class="row g-2 mt-1">
    <div class="col-md-4"><label class="form-label">邮箱</label><input class="form-control" name="receiver_email"></div>
    <div class="col-md-8"><label class="form-label">收件人短地址</label><input class="form-control" name="receiver_short_address"></div>
  </div>

  <div class="form-section-title">包裹信息</div>
  <div class="row g-2">
    <div class="col-md-2"><label class="form-label">件数 *</label><input class="form-control" type="number" name="package_count" value="1" required></div>
    <div class="col-md-2"><label class="form-label">包裹总重量(kg) *</label><input class="form-control" type="number" step="0.001" name="total_weight" required></div>
    <div class="col-md-2"><label class="form-label">长(cm)</label><input class="form-control" type="number" step="0.01" name="package_length" value="0"></div>
    <div class="col-md-2"><label class="form-label">宽(cm)</label><input class="form-control" type="number" step="0.01" name="package_width" value="0"></div>
    <div class="col-md-2"><label class="form-label">高(cm)</label><input class="form-control" type="number" step="0.01" name="package_height" value="0"></div>
  </div>

  <div class="form-section-title">发件人信息</div>
  <div class="row g-2">
    <div class="col-md-3"><label class="form-label">姓名</label><input class="form-control" name="sender_name"></div>
    <div class="col-md-3"><label class="form-label">公司</label><input class="form-control" name="sender_company"></div>
    <div class="col-md-3"><label class="form-label">国家</label><input class="form-control" name="sender_country" value="CN"></div>
    <div class="col-md-3"><label class="form-label">USCI</label><input class="form-control" name="sender_usci"></div>
  </div>
  <div class="row g-2 mt-1">
    <div class="col-md-4"><label class="form-label">详细地址</label><input class="form-control" name="sender_address"></div>
    <div class="col-md-2"><label class="form-label">城市</label><input class="form-control" name="sender_city"></div>
    <div class="col-md-2"><label class="form-label">省/州</label><input class="form-control" name="sender_state"></div>
    <div class="col-md-2"><label class="form-label">邮编</label><input class="form-control" name="sender_zip"></div>
    <div class="col-md-2"><label class="form-label">电话</label><input class="form-control" name="sender_phone"></div>
  </div>
  <div class="row g-2 mt-1">
    <div class="col-md-4"><label class="form-label">邮箱</label><input class="form-control" name="sender_email"></div>
  </div>

  <div class="form-section-title">销售平台信息（选填）</div>
  <div class="row g-2">
    <div class="col-md-3"><label class="form-label">平台名称</label><input class="form-control" name="platform_name"></div>
    <div class="col-md-2"><label class="form-label">平台代码</label><input class="form-control" name="platform_code"></div>
    <div class="col-md-3"><label class="form-label">销售平台链接</label><input class="form-control" name="platform_sales_link"></div>
    <div class="col-md-2"><label class="form-label">平台电话</label><input class="form-control" name="platform_phone"></div>
    <div class="col-md-2"><label class="form-label">平台邮箱</label><input class="form-control" name="platform_email"></div>
  </div>
  <div class="row g-2 mt-1">
    <div class="col-md-4"><label class="form-label">平台地址</label><input class="form-control" name="platform_address"></div>
    <div class="col-md-2"><label class="form-label">平台省/州</label><input class="form-control" name="platform_state"></div>
    <div class="col-md-2"><label class="form-label">平台邮编</label><input class="form-control" name="platform_zip"></div>
  </div>

  <div class="form-section-title">支付信息（选填）</div>
  <div class="row g-2">
    <div class="col-md-4"><label class="form-label">支付平台</label><input class="form-control" name="payment_platform"></div>
    <div class="col-md-4"><label class="form-label">支付平台账号</label><input class="form-control" name="payment_account"></div>
    <div class="col-md-4"><label class="form-label">支付交易号</label><input class="form-control" name="payment_transaction_no"></div>
  </div>

  <div class="form-section-title">申报品名信息（可添加多行）</div>
  <table class="table table-bordered bg-white" id="items-table">
    <thead class="table-light">
      <tr>
        <th>SKU</th><th>英文申报品名 *</th><th>中文申报品名 *</th><th>数量 *</th>
        <th>申报FOB价 *</th><th>成交价</th><th>单重(kg) *</th><th>海关编码</th><th>材质</th><th>品牌</th><th></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><input class="form-control form-control-sm" name="item_sku"></td>
        <td><input class="form-control form-control-sm" name="item_name_en" placeholder="Picture puzzle" required></td>
        <td><input class="form-control form-control-sm" name="item_name_cn" placeholder="木质拼图" required></td>
        <td><input class="form-control form-control-sm" type="number" name="item_qty" value="1" required></td>
        <td><input class="form-control form-control-sm" type="number" step="0.01" name="item_fob" required></td>
        <td><input class="form-control form-control-sm" type="number" step="0.01" name="item_price"></td>
        <td><input class="form-control form-control-sm" type="number" step="0.001" name="item_unit_weight" required></td>
        <td><input class="form-control form-control-sm" name="item_hs_code"></td>
        <td><input class="form-control form-control-sm" name="item_material"></td>
        <td><input class="form-control form-control-sm" name="item_brand"></td>
        <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)">删除</button></td>
      </tr>
    </tbody>
  </table>
  <button type="button" class="btn btn-sm btn-outline-secondary mb-3" onclick="addRow()">+ 添加一行申报品名</button>

  <div class="mt-3">
    <button class="btn btn-primary" type="submit">保存订单</button>
    <a href="/orders" class="btn btn-secondary">取消</a>
  </div>
</form>

<script>
function addRow() {
  const tbody = document.querySelector('#items-table tbody');
  const first = tbody.querySelector('tr').cloneNode(true);
  first.querySelectorAll('input').forEach(i => i.value = (i.name === 'item_qty' ? 1 : ''));
  tbody.appendChild(first);
}
function removeRow(btn) {
  const tbody = document.querySelector('#items-table tbody');
  if (tbody.querySelectorAll('tr').length > 1) {
    btn.closest('tr').remove();
  }
}
</script>
{% endblock %}
