version: "3.8"
services:
  erp:
    build: .
    image: cross-border-erp:latest
    container_name: cross-border-erp
    ports:
      - "8311:8311"
    volumes:
      - erp_data:/data
    environment:
      - SECRET_KEY=change-this-to-a-random-secret-in-production
      - ERP_DATA_DIR=/data
    restart: unless-stopped

volumes:
  erp_data:
